<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="13.8 677.13 649.07 265.1" width="649.07" height="265.1">
  <title>Service ribbon (Wildfire Service lower tab)</title>
  <desc>A band hugging the crest's outer oval: half-span 49.7°, face 85.5 deep, border 15, ends leaning 14°, fitted to the traced source ribbon. It can grow around the oval (layout.json tab; site/src/tab.ts). The upper tab is this shape turned upside down: rotate(180) about the crest centre. Isolated from bc-ministry-primitives-v5/data/art.json → sourceRibbon, redrawn as a parametric band. Original coordinates retained; only the viewBox is cropped. Reference-based reconstruction, not an official master.</desc>
