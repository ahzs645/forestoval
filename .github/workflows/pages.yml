name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared-primitives/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          # One npm workspace: the site and the live lettering package share a lockfile.
          cache-dependency-path: shared-primitives/package-lock.json
      # The primitives, layout and lettering data are generated and committed;
      # fail if they no longer match their sources (rerun extract_primitives.py).
      - name: Check generated files are up to date
        run: |
          python3 ../extract_primitives.py
          git diff --exit-code -- ..
      # Kabel Black is committed for now; the secret is the fallback if it is
      # removed again. Without either the build still works and the editor
      # offers a local-file picker; it never downloads a substitute.
      - name: Stage optional Kabel Black font
        env:
          KABEL_BLACK_OTF_BASE64: ${{ secrets.KABEL_BLACK_OTF_BASE64 }}
        run: |
          if [ -f ../../bc-ministry-primitives-v5/fonts/Kabel-Black.otf ]; then
            python3 ../../bc-ministry-primitives-v5/tools/setup_kabel.py --check
          elif [ -n "$KABEL_BLACK_OTF_BASE64" ]; then
            python3 ../../bc-ministry-primitives-v5/tools/setup_kabel.py --from-env KABEL_BLACK_OTF_BASE64
          else
            echo "No deployment font supplied; use Load Kabel-Black.otf in the editor."
          fi
      - run: npm ci
      # Also builds the v5 studio into dist/studio/ and the standalone live
      # lettering app into dist/lettering/.
      - run: npm run build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: shared-primitives/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
